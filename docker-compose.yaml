version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: chirplocal_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chirplocal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chirplocal_password}
      POSTGRES_DB: ${POSTGRES_DB:-chirplocal_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chirplocal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chirplocal_network

  redis:
    image: redis:7-alpine
    container_name: chirplocal_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chirplocal_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: chirplocal_backend
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-chirplocal}:${POSTGRES_PASSWORD:-chirplocal_password}@postgres:5432/${POSTGRES_DB:-chirplocal_db}
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-this}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - CONTACT_API_URL=${CONTACT_API_URL:-http://localhost:5050/api/contact}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chirplocal_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: chirplocal_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8001
      - VITE_WS_URL=ws://localhost:8001/ws
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - chirplocal_network
    command: npm run dev -- --host

networks:
  chirplocal_network:
    driver: bridge

volumes:
  postgres_data:
